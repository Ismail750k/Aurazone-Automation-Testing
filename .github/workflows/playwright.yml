name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: |
        npx playwright test tests/demo/login.spec.js --project chromium
        npx playwright test tests/demo/registration.spec.js --project chromium
        npx playwright test tests/demo/addcart.spec.js --project chromium
        npx playwright test tests/demo/updatecart.spec.js --project chromium
        npx playwright test tests/demo/checkout.spec.js --project chromium
        npx playwright test tests/demo/logout.spec.js --project chromium 
        npx playwright test tests/demo/search.spec.js --project chromium
        npx playwright test tests/demo/productdetails.spec.js --project chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
